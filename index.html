<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stack Using Linked List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <h1>Stack Using Linked List</h1>
    <p class="subtitle">LIFO: Last In, First Out</p>

    <div class="container">

        <h2>Stack Operations</h2>

        <input type="number" id="value" placeholder="Enter a value">

        <div class="buttons">
            <button class="push" onclick="push()">Push</button>
            <button class="pop" onclick="pop()">Pop</button>
            <button class="search" onclick="search()">Search</button>
            <button class="display" onclick="display()">Display</button>
            <button class="clear" onclick="clearStack()">Clear</button>
        </div>

        <p id="status">Your stack is empty.</p>

        <h2>Current Stack</h2>

        <div id="stackView">
            <p>No nodes available.</p>
        </div>

        <h2>Total Nodes: <span id="size">0</span></h2>

    </div>

    <footer>
        Data Structure Lab | HTML, CSS & JavaScript
    </footer>

</body>
</html>
